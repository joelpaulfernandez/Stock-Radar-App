name: Canada Contract Monitor

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Restore seen-articles cache
        uses: actions/cache@v4.2.2
        with:
          path: backend/seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: seen-articles-

      - name: Run monitor
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python backend/monitor.py

      - name: Save seen-articles cache
        uses: actions/cache@v4.2.2
        with:
          path: backend/seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: seen-articles-
